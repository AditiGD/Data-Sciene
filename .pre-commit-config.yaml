# Install once with `make setup` (runs `pre-commit install`). Run on everything:
#   uv run pre-commit run --all-files
# Ruff hooks are limited to our code (src/, tests/, notebooks/).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in sync with the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(src|tests|notebooks)/
      - id: ruff-format
        files: ^(src|tests|notebooks)/
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.2
    hooks:
      - id: nbstripout
