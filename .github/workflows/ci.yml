name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Python version comes from .python-version; exact packages from uv.lock
      - run: uv sync --locked
      - run: uv run ruff check src tests notebooks
      - run: uv run ruff format --check src tests notebooks
      - run: uv run mypy src
      # The raw dataset is not available in CI: unit tests use synthetic fixtures and
      # the @pytest.mark.rawdata integration tests are skipped (ESC_DATA_ROOT unset).
      - run: uv run pytest --cov --cov-report=term-missing:skip-covered
